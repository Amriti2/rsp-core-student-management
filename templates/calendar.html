<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.png') }}">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RSP Core">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Calendar - RSP Core</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <!-- FullCalendar -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #030712;
            color: #e2e8f0;
        }
        
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .fc {
            background: rgba(15, 23, 42, 0.8);
            color: #e2e8f0;
        }
        .fc .fc-toolbar-title {
            color: #e2e8f0;
            font-weight: 800;
        }
        .fc .fc-button {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
        }
        .fc .fc-button:hover {
            background: rgba(56, 189, 248, 0.2);
        }
        .fc .fc-button:not(:disabled).fc-button-active {
            background: #38bdf8;
            color: #030712;
        }
        .fc .fc-daygrid-day {
            background: rgba(3, 7, 18, 0.5);
        }
        .fc .fc-daygrid-day:hover {
            background: rgba(56, 189, 248, 0.1);
        }
        .fc .fc-day-today {
            background: rgba(56, 189, 248, 0.2) !important;
        }
        .fc .fc-event {
            background: linear-gradient(135deg, #38bdf8, #3b82f6);
            border: none;
            color: white;
        }
        .fc .fc-event:hover {
            background: linear-gradient(135deg, #06b6d4, #2563eb);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.2); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen p-6 bg-grid">

    <div class="max-w-7xl mx-auto">
        <nav class="flex justify-between items-center mb-8 glass-card p-4 rounded-2xl">
            <div class="flex items-center gap-4">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="w-10 h-10 rounded-lg object-cover border border-blue-500/50">
                <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300">
                    RSP Calendar
                </h1>
            </div>
            <div class="flex items-center gap-4">
                <a href="/" class="text-slate-300 hover:text-white font-semibold transition-all">← Back to Home</a>
                <span class="text-[10px] font-bold text-cyan-500 uppercase tracking-widest bg-cyan-500/10 px-3 py-1 rounded-full border border-cyan-500/20">Academic Calendar</span>
            </div>
        </nav>

        <div class="grid lg:grid-cols-4 gap-6">
            <div class="lg:col-span-3">
                <div class="glass-card p-6 rounded-3xl">
                    <div id="calendar"></div>
                </div>
            </div>
            
            <div class="space-y-6">
                <div class="glass-card p-6 rounded-3xl">
                    <h3 class="text-lg font-bold text-white mb-4">📅 Upcoming Events</h3>
                    <div id="upcoming-events" class="space-y-3"></div>
                </div>
                
                <div id="add-event-section" class="glass-card p-6 rounded-3xl hidden">
                    <h3 class="text-lg font-bold text-white mb-4">➕ Add Event</h3>
                    <form id="event-form" class="space-y-4">
                        <input type="text" id="event-title" placeholder="Event Title" class="w-full p-3 rounded-xl bg-[#030712] border border-white/10 text-white outline-none" required>
                        <textarea id="event-description" placeholder="Description" class="w-full p-3 rounded-xl bg-[#030712] border border-white/10 text-white outline-none" rows="3"></textarea>
                        <input type="datetime-local" id="event-date" class="w-full p-3 rounded-xl bg-[#030712] border border-white/10 text-white outline-none" required>
                        <div class="flex gap-2">
                            <button type="submit" class="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white py-3 rounded-xl font-bold">Add Event</button>
                            <button type="button" onclick="cancelAddEvent()" class="px-4 py-3 rounded-xl bg-gray-600 hover:bg-gray-500 text-white">Cancel</button>
                        </div>
                    </form>
                </div>
                
                <button id="add-event-btn" onclick="showAddEvent()" class="w-full glass-card p-4 rounded-3xl text-center hover:bg-white/5 transition-all hidden">
                    <span class="text-cyan-400 font-bold">+ Add New Event</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCUzB3aZnLSzFkryZX3trapEGswvsVCo4",
            authDomain: "rsp-system.firebaseapp.com",
            projectId: "rsp-system",
            storageBucket: "rsp-system.firebasestorage.app",
            messagingSenderId: "824223028059",
            appId: "1:824223028059:web:3b3dee618a59edea47807e"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let calendar;
        let isPrincipal = false; // This should be set based on login, for now assume false

        document.addEventListener('DOMContentLoaded', function() {
            // Check if user is principal (simplified)
            const urlParams = new URLSearchParams(window.location.search);
            isPrincipal = urlParams.get('principal') === 'true'; // Pass this from backend
            
            if (isPrincipal) {
                document.getElementById('add-event-btn').classList.remove('hidden');
            }

            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                events: loadEvents,
                eventClick: handleEventClick,
                dateClick: isPrincipal ? handleDateClick : null,
                height: 'auto',
                themeSystem: 'standard'
            });
            calendar.render();
            loadUpcomingEvents();
        });

        function loadEvents(fetchInfo, successCallback, failureCallback) {
            db.collection("calendar_events").get().then(snapshot => {
                const events = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    events.push({
                        id: doc.id,
                        title: data.title,
                        start: new Date(data.date),
                        description: data.description,
                        extendedProps: { description: data.description }
                    });
                });
                successCallback(events);
            }).catch(failureCallback);
        }

        function handleEventClick(info) {
            alert(`${info.event.title}\n\n${info.event.extendedProps.description || 'No description'}`);
        }

        function handleDateClick(info) {
            if (!isPrincipal) return;
            document.getElementById('event-date').value = info.dateStr + 'T12:00';
            showAddEvent();
        }

        function showAddEvent() {
            document.getElementById('add-event-section').classList.remove('hidden');
            document.getElementById('add-event-btn').classList.add('hidden');
        }

        function cancelAddEvent() {
            document.getElementById('add-event-section').classList.add('hidden');
            document.getElementById('add-event-btn').classList.remove('hidden');
            document.getElementById('event-form').reset();
        }

        document.getElementById('event-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const title = document.getElementById('event-title').value;
            const description = document.getElementById('event-description').value;
            const date = document.getElementById('event-date').value;
            
            db.collection("calendar_events").add({
                title: title,
                description: description,
                date: new Date(date).toISOString(),
                createdBy: 'principal'
            }).then(() => {
                calendar.refetchEvents();
                loadUpcomingEvents();
                cancelAddEvent();
                alert('Event added successfully!');
            });
        });

        function loadUpcomingEvents() {
            const now = new Date();
            const nextWeek = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
            
            db.collection("calendar_events")
                .where("date", ">=", now.toISOString())
                .where("date", "<=", nextWeek.toISOString())
                .orderBy("date")
                .limit(5)
                .get().then(snapshot => {
                    const container = document.getElementById('upcoming-events');
                    container.innerHTML = '';
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        const eventDate = new Date(data.date);
                        const div = document.createElement('div');
                        div.className = 'p-3 rounded-xl bg-cyan-500/10 border border-cyan-500/20';
                        div.innerHTML = `
                            <p class="text-sm font-bold text-cyan-400">${data.title}</p>
                            <p class="text-xs text-slate-400">${eventDate.toLocaleDateString()}</p>
                        `;
                        container.appendChild(div);
                    });
                });
        }
    </script>
</body>
</html>
