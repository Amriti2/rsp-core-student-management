<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Service - RSP Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Outfit', sans-serif; margin: 0; min-height: 100vh; background: radial-gradient(circle at top left, #0f172a 0%, #020617 100%); color: #e2e8f0; }
        .glass-card { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); border-radius: 24px; transition: all 0.3s ease; }
        .glass-card:hover { border-color: rgba(56, 189, 248, 0.4); box-shadow: 0 0 20px rgba(56, 189, 248, 0.1); }
        .goal-ring {
            width: 280px; height: 280px; border-radius: 50%; display: grid; place-items: center;
            background: conic-gradient(#38bdf8 var(--percent), rgba(255,255,255,0.05) var(--percent));
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
        }
        .goal-ring .inner { width: 220px; height: 220px; border-radius: 50%; background: #0f172a; display: grid; place-items: center; text-align: center; }
        .status-badge { padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .pending { background: rgba(234, 179, 8, 0.2); color: #fbbf24; border: 1px solid #ca8a04; }
        .approved { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #16a34a; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <nav class="mb-8 flex items-center justify-between glass-card p-6">
            <div>
                <h1 class="text-3xl font-extrabold bg-gradient-to-r from-sky-400 to-blue-600 bg-clip-text text-transparent">Hero Journey</h1>
                <p class="text-slate-400 text-sm">Community Service Tracker</p>
            </div>
            <a href="/dashboard/{{ user_id }}" class="px-5 py-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 transition">← Dashboard</a>
        </nav>

        <div class="grid lg:grid-cols-3 gap-8">
            <section class="glass-card p-8 flex flex-col items-center">
                <h2 class="text-xl font-bold mb-6 self-start">Total Approved Hours</h2>
                <div class="goal-ring" id="progressRing" style="--percent: 0%;">
                    <div class="inner">
                        <div>
                            <span id="hoursValue" class="text-5xl font-black text-white">0</span>
                            <p class="text-slate-400 text-sm">of 100 hrs</p>
                        </div>
                    </div>
                </div>
                <div class="mt-8 space-y-2 text-center">
                    <p id="remainingText" class="text-sky-300 font-medium"></p>
                </div>
            </section>

            <section class="glass-card p-8 lg:col-span-2">
                <h2 class="text-xl font-bold mb-6">Log Activity</h2>
                
                <form id="communityForm" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-10">
                    <input id="location" required type="text" placeholder="Where did you serve?" class="p-3 rounded-xl bg-slate-900 border border-white/10 outline-none focus:border-sky-500 transition">
                    <input id="hours" required type="number" min="0.5" step="0.5" placeholder="How many hours?" class="p-3 rounded-xl bg-slate-900 border border-white/10 outline-none focus:border-sky-500 transition">
                    <input id="serviceDate" required type="date" class="p-3 rounded-xl bg-slate-900 border border-white/10 text-white outline-none focus:border-sky-500 transition">
                    <input id="notes" placeholder="Short description (optional)" class="p-3 rounded-xl bg-slate-900 border border-white/10 outline-none focus:border-sky-500 transition">
                    <button type="submit" class="md:col-span-2 py-4 bg-sky-600 hover:bg-sky-500 text-white font-bold rounded-xl shadow-lg shadow-sky-900/20 transition transform active:scale-95">
                        Submit for Verification
                    </button>
                </form>

                <h3 class="text-sm font-bold text-slate-500 uppercase tracking-widest mb-4">Activity History</h3>
                <div id="activityLog" class="space-y-3">
                    </div>
            </section>
        </div>
    </div>

    <script>
        // FIREBASE SETUP
        const firebaseConfig = {
            apiKey: "AIzaSyCUzB3aZnLSzFkryZX3trapEGswvsVCo4",
            authDomain: "rsp-system.firebaseapp.com",
            projectId: "rsp-system",
            storageBucket: "rsp-system.firebasestorage.app",
            messagingSenderId: "824223028059",
            appId: "1:824223028059:web:3b3dee618a59edea47807e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        // Dynamic variables from your Flask backend
        const userId = "{{ user_id }}"; 
        const isPrincipal = "{{ 'true' if is_principal else 'false' }}" === "true";
        const userRef = db.collection('users').doc(userId);

        // UI ELEMENTS
        const progressRing = document.getElementById('progressRing');
        const hoursValue = document.getElementById('hoursValue');
        const activityLog = document.getElementById('activityLog');

        function updateUI(data) {
            const list = data.community_service || [];
            const approvedTotal = data.community_hours || 0;
            
            // Update Progress Ring
            const percent = Math.min(100, (approvedTotal / 100) * 100);
            progressRing.style.setProperty('--percent', (percent * 3.6) + 'deg');
            hoursValue.innerText = approvedTotal;
            document.getElementById('remainingText').innerText = `You need ${Math.max(0, 100 - approvedTotal)} more hours!`;

            // Update Log
            activityLog.innerHTML = '';
            list.slice().reverse().forEach(entry => {
                const div = document.createElement('div');
                div.className = 'glass-card p-4 flex items-center justify-between bg-white/5 border-none';
                
                // Show "Approve" button only to Principal and only if status is pending
                const actionButton = (isPrincipal && entry.status === 'pending') 
                    ? `<button onclick="approveEntry('${entry.id}', ${entry.hours})" class="bg-emerald-500 text-black text-xs font-bold px-3 py-1 rounded-lg hover:bg-emerald-400">Approve</button>`
                    : `<button onclick="deleteEntry('${entry.id}')" class="text-red-400 text-xs hover:underline">Delete</button>`;

                div.innerHTML = `
                    <div class="flex flex-col">
                        <div class="flex items-center gap-2">
                            <span class="font-bold">${entry.location}</span>
                            <span class="status-badge ${entry.status}">${entry.status}</span>
                        </div>
                        <span class="text-xs text-slate-400">${entry.date} • ${entry.hours} hrs</span>
                    </div>
                    <div class="flex gap-4 items-center">
                        ${actionButton}
                    </div>
                `;
                activityLog.appendChild(div);
            });
        }

        // Listen for data updates
        userRef.onSnapshot(doc => {
            if (doc.exists) updateUI(doc.data());
        });

        // Submit Form
        document.getElementById('communityForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const entry = {
                id: Date.now().toString(),
                location: document.getElementById('location').value,
                hours: parseFloat(document.getElementById('hours').value),
                date: document.getElementById('serviceDate').value,
                notes: document.getElementById('notes').value,
                status: 'pending' // Always starts as pending
            };

            await userRef.update({
                community_service: firebase.firestore.FieldValue.arrayUnion(entry)
            });
            e.target.reset();
        });

        // APPROVE LOGIC (Principal Only)
        window.approveEntry = async (id, hourValue) => {
            const doc = await userRef.get();
            const list = doc.data().community_service;
            const updatedList = list.map(item => {
                if(item.id === id) item.status = 'approved';
                return item;
            });

            await userRef.update({
                community_service: updatedList,
                community_hours: firebase.firestore.FieldValue.increment(hourValue)
            });
        };

        // DELETE LOGIC
        window.deleteEntry = async (id) => {
            if(!confirm("Delete this record?")) return;
            const doc = await userRef.get();
            const data = doc.data();
            const entry = data.community_service.find(e => e.id === id);
            
            const updateObj = {
                community_service: firebase.firestore.FieldValue.arrayRemove(entry)
            };

            if(entry.status === 'approved') {
                updateObj.community_hours = firebase.firestore.FieldValue.increment(-entry.hours);
            }

            await userRef.update(updateObj);
        };
    </script>
</body>
</html>
